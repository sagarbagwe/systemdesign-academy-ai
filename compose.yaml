services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: academy
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: ${ACADEMY_DATABASE_PASSWORD:-academy-local}
    volumes:
      - academy-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d academy"]
      interval: 3s
      timeout: 3s
      retries: 15
  app:
    build: .
    ports:
      - "127.0.0.1:${ACADEMY_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ACADEMY_DATABASE_URL: jdbc:postgresql://db:5432/academy
      ACADEMY_DATABASE_USER: academy
      ACADEMY_DATABASE_PASSWORD: ${ACADEMY_DATABASE_PASSWORD:-academy-local}
      ACADEMY_ORIGIN: ${ACADEMY_ORIGIN:-http://localhost:8080}
      ACADEMY_SECURE_COOKIE: ${ACADEMY_SECURE_COOKIE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
volumes:
  academy-data:
