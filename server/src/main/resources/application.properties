spring.application.name=SystemDesign Academy AI
spring.datasource.url=${ACADEMY_DATABASE_URL:jdbc:postgresql://localhost:5432/academy}
spring.datasource.username=${ACADEMY_DATABASE_USER:academy}
spring.datasource.password=${ACADEMY_DATABASE_PASSWORD:academy}
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-trailing-tokens=true
server.forward-headers-strategy=none
server.error.include-message=never
academy.origin=${ACADEMY_ORIGIN:http://localhost:8080}
academy.secure-cookie=${ACADEMY_SECURE_COOKIE:true}
academy.openai.key=${OPENAI_API_KEY:}
academy.openai.model=${OPENAI_MODEL:gpt-5.4-mini}
academy.stripe.key=${STRIPE_SECRET_KEY:}
academy.stripe.price=${STRIPE_PRICE_ID:}
academy.stripe.webhook=${STRIPE_WEBHOOK_SECRET:}
